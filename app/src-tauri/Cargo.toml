[package]
name = "keld-signal-app"
version = "0.1.0"
description = "Keld Signal — your focus blocks, your projects, and whether they reached Atlas"
authors = ["Keld"]
edition = "2021"
rust-version = "1.77"

# ⚠️ **THE SHELL RUNS NOTHING.** It opens a window on the page the daemon
# already serves at 127.0.0.1, and that is the whole of it: no collection, no
# analysis, no credential of its own. Everything it shows is the same embedded
# page `keld signal open` opens in a browser, so the two can never disagree
# about what a person is looking at.
#
# It uses the SYSTEM web view rather than bundling one — WKWebView on macOS,
# WebView2 on Windows, WebKitGTK on Linux. That keeps the app a single small
# binary, which matters here specifically because the macOS installer already
# sits behind Apple's notary service and every file in a submission is scanned:
# an Electron shell would add a Chromium framework tree to a payload that was
# deliberately cut to four files for exactly that reason.

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# Tauri's own convention: a release build with no custom-protocol asset server.
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
# The app is a window around a web view; nothing here is hot. Optimise for size
# so the shipped binary stays small enough that bundling it into the existing
# installers is not a conversation about download size.
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
