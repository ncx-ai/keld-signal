name: ci

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt gate
        run: |
          gofmt -l .
          test -z "$(gofmt -l .)"
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./...

  goreleaser-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: check

  crosscheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: cross-platform pure-Go build gate
        run: make crosscheck

  # `make freeze-check` / `make obfuscate-check` are NOT run here: they need a
  # provisioned sidecar venv (torch/gliner2, ~5GB) plus the ~1.9GB GLiNER2 model
  # and take minutes (PyInstaller bundling torch, then a real model load) — that
  # cost is already paid once per release in installers.yml, not per push/PR.
  # This job instead runs the cheap half every push/PR: it needs only
  # python-minifier + pyarmor (no torch, no model, no PyInstaller freeze) and
  # asserts *coverage* — every sidecar/app/**/*.py actually comes out
  # obfuscated — which is what a non-recursive glob in build-freeze.sh silently
  # broke for a whole subpackage (sidecar/app/analysis/) without either make
  # target catching it, since both only check that the frozen binary runs.
  obfuscation-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install obfuscation tools (no torch)
        run: pip install --quiet python-minifier pyarmor
      - name: obfuscation coverage gate
        run: make obfuscation-coverage-check

  # The real app.analysis identity gate (scripts/check_identity.py against the frozen corpus
  # at ~/keld/refseries-context/frozen-corpus/) can't run here: 736MB of real AI-coding-session
  # transcripts on one laptop, outside the repo, unshareable by the project's own privacy
  # invariant. This is the floor everyone else gets instead — a small, wholly-synthetic fixture
  # corpus (sidecar/app/analysis/testdata/) committed alongside its own baseline fingerprint.
  # No torch, no spaCy model (KELD_TERMS=0 — see the fixture's own docstring for why): only
  # pandas/pyarrow/bashlex/wordfreq, so this stays cheap enough to run every push/PR.
  fixture-identity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install analysis deps (no torch, no spaCy model)
        run: pip install --quiet pandas pyarrow bashlex wordfreq pyyaml
      - name: fixture identity gate
        run: make fixture-identity-check STUDY_PYTHON=python

  # fastapi==0.115.* and uvicorn[standard]==0.32.* sat 26 / 20 minor releases
  # behind for over a year with nothing anywhere checking — a trailing-wildcard
  # pin silently freezes once upstream abandons that series, and there was no
  # signal until someone looked by hand. This job is that signal, every
  # push/PR, for free: it reads sidecar/requirements.txt's exact `name==X.Y.Z`
  # pins and asks PyPI how old each one is — one JSON GET per pin, no pip
  # install, no torch. It does NOT fail on "a newer version exists" (true on
  # nearly every run for a fast-moving package like fastapi, which is exactly
  # the kind of check that gets disabled for crying wolf); it fails only once a
  # pin's own release is materially old (default: >365 days) AND a newer
  # release is actually available — see scripts/check_dependency_staleness.py
  # for the full reasoning. gliner2/torch/transformers/numpy (the ML stack) and
  # the spacy/wordfreq wildcard pins are out of scope for this check: bumping
  # them needs enrich/eval revalidation, not just a version check.
  dependency-staleness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: dependency staleness check (sidecar/requirements.txt)
        run: make dependency-staleness-check
